{% extends "base.html" %}
{% block title %}{{ 'Qeydiyyat' if mode == 'register' else 'Giriş' }} · Valuora AZ{% endblock %}
{% block content %}
<form class="card auth" method="post" action="/{{ mode }}">
  <h2>{{ 'Qeydiyyat' if mode == 'register' else 'Giriş' }}</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="email" name="email" placeholder="E-poçt" required>
  <input type="password" name="password" placeholder="Şifrə (min. 8 simvol)" minlength="8" required>
  <button class="btn" type="submit">Davam et</button>
</form>
{% endblock %}
