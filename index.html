<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valuora AZ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav"><span class="logo">Valuora<span>AZ</span></span></header>
  <main class="wrap">
    <section class="hero">
      <h1>Qiymət ucuzdur, yoxsa bahalı?</h1>
      <p>Məhsul linkini yapışdır, qiyməti bazar müşahidələri ilə müqayisə edək.</p>
    </section>
    <form id="analyze-form" class="card row">
      <input type="url" name="url" placeholder="https://magaza.az/mehsul" required>
      <button class="btn" type="submit">Analiz et</button>
    </form>
    <p id="msg" class="error" hidden></p>
    <div class="head"><h2>Tarixçə</h2><button id="clear" class="link">Təmizlə</button></div>
    <div id="history" class="grid"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
