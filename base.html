<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Valuora AZ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">Valuora<span>AZ</span></a>
    <nav>
      {% if user %}
        <a href="/dashboard">Panel</a><a href="/logout">Çıxış</a>
      {% else %}
        <a href="/login">Giriş</a><a class="btn" href="/register">Qeydiyyat</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</body>
</html>
